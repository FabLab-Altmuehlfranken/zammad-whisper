[project]
name = "zammad-whisper"
version = "1.0.2"
description = "Searches open Zammad tickets for voice notes and adds a comment with a Whisper transcription"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-executor>=1.0.0",
    "openai-whisper>=20250625",
    "requests>=2.33.1",
    "sentry-sdk>=2.62.0",
    "zammad-py>=3.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
